[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeexec-rl"
version = "0.0.1"
description = "An execution-grounded RL environment for code generation, and a study of visible-test overfitting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "evalplus==0.3.1",
]

# ML dependencies are added per phase and pinned exactly when introduced.
# Phase 4 adds the training stack (ADR-011) as the `train` extra, installed only
# on the training box. The full resolved set is pinned in requirements/train.lock.
# Pinning at the point of introduction rather than up front keeps unused version
# churn out of the lockfile, but every addition is pinned, never floated.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
    "shellcheck-py==0.11.0.1",
]
train = [
    "trl[vllm]==1.16.0",
    "vllm==0.31.0",
    "torch==2.13.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "wandb==0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeexec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# Libraries with no type information in CI: evalplus ships none, and the
# training stack (torch, TRL, datasets, vLLM) is untyped or installed only on the
# training box. Treat them as untyped; only our use of them is checked.
[[tool.mypy.overrides]]
module = [
    "evalplus.*", "torch", "torch.*", "trl", "trl.*", "datasets", "datasets.*", "vllm", "vllm.*",
]
ignore_missing_imports = true

# matplotlib (for the throughput chart) pulls in numpy, whose current stubs use
# Python 3.12+ syntax that trips mypy's 3.11 target. Skip type-checking these
# third-party libraries; only our use of them at the boundary is checked.
[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require Docker and run real containers (slower)",
    "dataset: tests that download EvalPlus datasets and run reference solutions (slower, network)",
]