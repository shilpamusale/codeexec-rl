[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeexec-rl"
version = "0.0.1"
description = "An execution-grounded RL environment for code generation, and a study of visible-test overfitting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

# ML dependencies are added per phase and pinned exactly when introduced.
# Phase 3 adds vllm + transformers; Phase 4 adds trl + torch. Pinning at the
# point of introduction rather than up front keeps unused version churn out of
# the lockfile, but every addition is pinned, never floated. See ADR-003.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeexec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
